<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPEEDE.fit</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7fc;
        margin: 0;
        padding: 0;
        color: #333;
        background-size: 100% 100%;
        background-image: url("static/background.jpg");
        background-position: center center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }

      header {
        background-color: #4285f4;
        color: white;
        padding: 20px;
        text-align: center;
      }

      h1 {
        font-size: 1.8em;
        margin-bottom: 20px;
      }

      .container {
        max-width: 600px;
        margin: 170px auto;
        padding: 20px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      label {
        font-size: 1.1em;
        margin-bottom: 10px;
        display: block;
      }

      input[type="text"] {
        background-color: #ffffff;
        color: #333;
        padding: 10px 20px;
        border-radius: 4px;
        margin-bottom: 20px;
        font-size: 1.1em;
        width: 100%;
        box-sizing: border-box;
        transition: all 0.3s ease;
      }

      input[type="text"]:focus {
        outline: none;
        border: 2px solid #4285f4;
        box-shadow: 0 0 5px rgba(66, 133, 244, 0.3);
      }

      button {
        background-color: #4285f4;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        font-size: 1.1em;
        cursor: pointer;
        width: 100%;
      }

      button:hover {
        background-color: #1165ec;
      }

      .logout {
        text-align: center;
        margin-top: 20px;
      }

      .logout a {
        color: #4285f4;
        text-decoration: none;
        font-weight: bold;
      }

      .logout a:hover {
        text-decoration: underline;
      }

      footer {
        margin-top: 30px;
        text-align: center;
        font-size: 0.9rem;
        color: #888;
      }

      footer a {
        color: #4285f4;
        text-decoration: none;
        font-weight: bold;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <!-- <header>
      <h1>Welcome, {{ user["name"] }}</h1>
    </header> -->

    <div class="container">
      <form method="get" action="/search" class="search-form">
        <h1>Welcome, {{ user["name"] }}</h1>
        <input
          type="text"
          id="query"
          name="query"
          required
          placeholder="Enter keyword to search PDFs"
          class="search-input"
        />
        <button type="submit" class="search-button">Search</button>
      </form>
      <div class="logout">
        <a href="/logout">Logout</a>
      </div>
    </div>

    <footer>
      <p>
        By using this service, you agree to our
        <a href="/contactus">Terms of Service</a> and
        <a href="/contactus">Privacy Policy</a>.
      </p>
    </footer>
  </body>
</html>
