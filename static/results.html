<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #4285f4;
            color: white;
            padding: 15px;
            text-align: center;
        }

        h2 {
            color: #4285f4;
            margin-bottom: 20px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .result-item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item strong {
            display: block;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .result-item a {
            color: #4285f4;
            text-decoration: none;
            font-weight: bold;
        }

        .result-item a:hover {
            text-decoration: underline;
        }

        .summary {
            margin-top: 10px;
            font-size: 1em;
            color: #555;
            line-height: 1.5;
        }

        .no-results {
            text-align: center;
            font-size: 1.2em;
            color: #f44336;
        }

        footer {
            background-color: #f4f7fc;
            padding: 10px;
            text-align: center;
            border-top: 1px solid #ddd;
        }

        footer a {
            color: #4285f4;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Search Results</h1>
    </header>

    <div class="container">
        {% if pdfs %}
            <ul>
            {% for pdf in pdfs %}
                <li class="result-item">
                    <strong>{{ pdf.subject }}</strong>
                    <a href="https://mail.google.com/mail/u/0/#inbox/{{ pdf.id }}" target="_blank">Open Email</a><br>
                    <strong>Attachment:</strong> {{ pdf.attachment }}<br>
                    <div class="summary">
                        <strong>Summary:</strong> {{ pdf.gpt_summary }}
                    </div>
                </li>
            {% endfor %}
            </ul>
        {% else %}
            <p class="no-results">No PDFs found matching your search query.</p>
        {% endif %}
    </div>
    <footer>
        <a href="/">Back to Home</a>
    </footer>

</body>
</html>
